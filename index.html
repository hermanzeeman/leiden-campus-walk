<!DOCTYPE html>

<meta charset="UTF-8">

<title>莱顿大学 · 漫步</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#05070c;overflow:hidden;
    font-family:"PingFang SC","Microsoft YaHei","WenQuanYi Zen Hei",sans-serif}
  #wrap{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
  canvas{image-rendering:pixelated;image-rendering:-moz-crisp-edges;image-rendering:crisp-edges;
    box-shadow:0 0 80px rgba(30,50,90,.5),0 0 0 1px #1c2436;max-width:100%;max-height:100%}
  #hint{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);
    color:#8fa4c4;font-size:13px;letter-spacing:.08em;background:rgba(8,12,20,.82);
    padding:7px 18px;border-radius:20px;border:1px solid #26324a;white-space:nowrap;
    pointer-events:none;transition:opacity .4s;z-index:10}
  #dialog{position:absolute;left:50%;bottom:6%;transform:translateX(-50%) translateY(14px);
    width:min(680px,88vw);background:linear-gradient(180deg,#f6efdd,#e8dcc2);
    border:3px solid #6b5535;border-radius:10px;padding:18px 22px 16px;
    box-shadow:0 12px 40px rgba(0,0,0,.6);opacity:0;pointer-events:none;
    transition:opacity .22s,transform .22s;z-index:20}
  #dialog.show{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}
  #speaker{font-size:15px;font-weight:700;color:#6b4a1e;letter-spacing:.1em;margin-bottom:8px;
    display:flex;align-items:center;gap:8px}
  #speaker::before{content:"";width:10px;height:10px;background:#8a6a2e;transform:rotate(45deg);display:inline-block}
  #text{font-size:15px;line-height:1.8;color:#2e2418;min-height:56px;white-space:pre-wrap}
  #next{text-align:right;font-size:12px;color:#8a7550;margin-top:6px;letter-spacing:.1em;animation:bl 1.1s infinite}
  @keyframes bl{0%,100%{opacity:.4}50%{opacity:1}}
  #fade{position:absolute;inset:0;background:#05070c;opacity:0;pointer-events:none;transition:opacity .28s;z-index:30}
  #fade.on{opacity:1;pointer-events:auto}
  #title{position:absolute;left:50%;top:26px;transform:translateX(-50%);
    color:#c8d4e8;font-size:14px;letter-spacing:.3em;opacity:0;transition:opacity .6s;
    pointer-events:none;text-shadow:0 2px 10px #000;z-index:10}
  #title.on{opacity:.85}
  /* ---- 移动端：摇杆 + 动作键 ---- */
  #touch{position:absolute;inset:0;pointer-events:none;display:none;z-index:15}
  #touch.on{display:block}
  #stickBase{position:absolute;left:22px;bottom:calc(24px + env(safe-area-inset-bottom));
    width:118px;height:118px;border-radius:50%;pointer-events:auto;touch-action:none;
    background:radial-gradient(circle,rgba(20,30,48,.55),rgba(12,18,30,.35));
    border:2px solid rgba(140,165,205,.45);box-shadow:0 0 18px rgba(0,0,0,.45)}
  #stickKnob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;
    border-radius:50%;background:radial-gradient(circle at 35% 30%,#e8eef8,#9fb2cc);
    box-shadow:0 3px 10px rgba(0,0,0,.5);transition:transform .05s linear}
  #btnE{position:absolute;right:26px;bottom:calc(40px + env(safe-area-inset-bottom));
    width:82px;height:82px;border-radius:50%;pointer-events:auto;touch-action:none;
    display:flex;align-items:center;justify-content:center;
    font-size:26px;font-weight:700;color:#f2f6ff;letter-spacing:.05em;
    background:radial-gradient(circle at 35% 30%,rgba(90,120,170,.95),rgba(40,58,88,.95));
    border:2px solid rgba(160,185,225,.6);box-shadow:0 4px 16px rgba(0,0,0,.5)}

  @media (pointer:coarse){
    #hint{bottom:auto;top:12px;font-size:11px;padding:5px 12px}
    #dialog{bottom:calc(150px + env(safe-area-inset-bottom));width:92vw;padding:14px 16px 12px}
    #text{font-size:14px;min-height:44px}
    #next{font-size:11px}
  }
</style>
</head>

<div id="wrap">

  <div id="title"></div>
  <div id="hint">WASD / 方向键 移动 · 走到门前按 E 进门 · 靠近人按 E 说话</div>
  <div id="dialog">
    <div id="speaker"></div>
    <div id="text"></div>
    <div id="next">E / 空格 / 点击 继续</div>
  </div>
  <div id="touch">
    <div id="stickBase"><div id="stickKnob"></div></div>

  </div>
  <div id="fade"></div>

function fit(){
  const vw=innerWidth, vh=innerHeight;
  if(isTouch){
    // 手机端：宽度铺满，高度按比例，整体居中，避免被裁切
    const k=Math.min(vw/cv.width, vh/cv.height);
    cv.style.width=Math.floor(cv.width*k)+"px";
    cv.style.height=Math.floor(cv.height*k)+"px";
  } else {
    const s=Math.min(vw/cv.width, vh/cv.height);
    const k=Math.max(1, Math.floor(s));
    cv.style.width=(cv.width*k)+"px";
    cv.style.height=(cv.height*k)+"px";
  }
}
addEventListener("resize", fit); fit();

const solidChars=new Set(["#","T","L","B","W","S","C","P","R"]);
/* 确保 NPC 不站在障碍物上：若落点被占，就近螺旋搜索一块空地 */
function placeNPCs(sc){
  const free=(c,r)=>c>=1&&c<COLS-1&&r>=1&&r<ROWS-1&&!solidChars.has(sc.map[r][c]);
  for(const n of sc.npcs){
    let c=Math.round(n.x), r=Math.round(n.y);
    if(free(c,r)){ n.x=c; n.y=r; continue; }
    let found=null;
    for(let rad=1;rad<12&&!found;rad++){
      for(let dr=-rad;dr<=rad&&!found;dr++)for(let dc=-rad;dc<=rad&&!found;dc++){
        if(Math.max(Math.abs(dr),Math.abs(dc))!==rad)continue;
        if(free(c+dc,r+dr))found={c:c+dc,r:r+dr};
      }
    }
    if(found){ n.x=found.c; n.y=found.r; }
  }
}
Object.values(SCENES).forEach(placeNPCs);
function solid(sc,c,r){
  if(r<0||r>=ROWS||c<0||c>=COLS)return true;
  return solidChars.has(sc.map[r][c]);
}

/* ---------- 状态 ---------- */

const player={x:0,y:0,w:18,h:14,speed:118,dir:"down",step:0};
function enter(name,sp){
  scene=name; S=SCENES[name];
  const spawnPoint=sp||S.spawn;
  player.x=spawnPoint.x*TILE; player.y=spawnPoint.y*TILE;
  showTitle(S.name);
}
const titleEl=document.getElementById("title");
let titleTimer=null;
function showTitle(t){
  titleEl.textContent=t; titleEl.classList.add("on");
  clearTimeout(titleTimer);
  titleTimer=setTimeout(()=>titleEl.classList.remove("on"),1800);
}

/* ---------- 星空 ---------- */
const stars=[];
(function(){
  let seed=20261102;
  const rnd=()=>{seed=(seed*1103515245+12345)&0x7fffffff;return seed/0x7fffffff;};
  for(let i=0;i<190;i++)stars.push({x:rnd()*cv.width,y:rnd()*150,r:rnd()<.85?1:2,
    ph:rnd()*6.283,sp:.6+rnd()*1.6,hue:rnd()});
})();

/* ---------- 输入 ---------- */
const keys={};
addEventListener("keydown",e=>{
  const k=e.key.toLowerCase();
  if(["arrowup","arrowdown","arrowleft","arrowright"," "].includes(k))e.preventDefault();
  keys[k]=true;
  if(k==="e"||k===" "){ if(dialogOpen)advance(); else interact(); }
});
addEventListener("keyup",e=>{keys[e.key.toLowerCase()]=false;});

/* 虚拟摇杆 */
const stick={x:0,y:0,active:false};
const baseEl=document.getElementById("stickBase"),knobEl=document.getElementById("stickKnob"),
      touchEl=document.getElementById("touch"),btnE=document.getElementById("btnE");
if(isTouch){
  touchEl.classList.add("on");
  document.getElementById("hint").textContent="摇杆移动 · 按 E 进门 / 说话";
}
(function bindStick(){
  let id=null,R=0;
  const setKnob=(dx,dy)=>{knobEl.style.transform=`translate(${dx}px,${dy}px)`;};
  const start=e=>{
    const t=e.changedTouches?e.changedTouches[0]:e;
    id=t.identifier!==undefined?t.identifier:"mouse";
    const r=baseEl.getBoundingClientRect();R=r.width/2;
    stick.active=true;move(e);
  };
  const move=e=>{
    if(!stick.active)return;
    const list=e.changedTouches?e.changedTouches:[e];
    let t=null;
    for(const c of list){ if((c.identifier!==undefined?c.identifier:"mouse")===id) t=c; }
    if(!t)return;
    const r=baseEl.getBoundingClientRect();
    let dx=t.clientX-(r.left+r.width/2), dy=t.clientY-(r.top+r.height/2);
    const d=Math.hypot(dx,dy), max=r.width/2-10;
    if(d>max){dx=dx/d*max;dy=dy/d*max;}
    setKnob(dx,dy);
    stick.x=dx/max;stick.y=dy/max;
    e.preventDefault();
  };
  const end=e=>{
    const list=e.changedTouches?e.changedTouches:[e];
    let hit=false;
    for(const c of list){ if((c.identifier!==undefined?c.identifier:"mouse")===id) hit=true; }
    if(!hit)return;
    stick.active=false;stick.x=0;stick.y=0;id=null;setKnob(0,0);
  };
  baseEl.addEventListener("touchstart",start,{passive:false});
  baseEl.addEventListener("touchmove",move,{passive:false});
  baseEl.addEventListener("touchend",end);
  baseEl.addEventListener("touchcancel",end);
  baseEl.addEventListener("mousedown",start);
  addEventListener("mousemove",move);
  addEventListener("mouseup",end);
})();
btnE.addEventListener("touchstart",e=>{e.preventDefault();e.stopPropagation();
  if(dialogOpen)advance(); else interact();},{passive:false});
btnE.addEventListener("click",e=>{e.stopPropagation();
  if(dialogOpen)advance(); else interact();});
cv.addEventListener("click",()=>{ if(dialogOpen)advance(); });
document.getElementById("dialog").addEventListener("click",()=>{ if(dialogOpen)advance(); });

/* ---------- 对话与交互 ---------- */
const dlgEl=document.getElementById("dialog"),spkEl=document.getElementById("speaker"),
      txtEl=document.getElementById("text"),hintEl=document.getElementById("hint");
let dialogOpen=false,curLines=null,curIdx=0,curName="";

function interact(){
  // 优先门
  for(const d of S.doors){
    const cx=(d.c+d.w/2)*TILE, cy=(d.r+d.h/2)*TILE;
    if(Math.hypot(cx-player.x,cy-player.y)<46){ goThrough(d); return; }
  }
  // 其次NPC
  let best=null,bd=1e9;
  for(const n of S.npcs){
    const dd=Math.hypot(n.x*TILE-player.x,n.y*TILE-player.y);
    if(dd<bd){bd=dd;best=n;}
  }
  if(best&&bd<62){
    curLines=best.lines;curIdx=0;curName=best.name;dialogOpen=true;
    dlgEl.classList.add("show");hintEl.style.opacity="0";renderLine();
  }
}
function goThrough(d){
  const fade=document.getElementById("fade");
  fade.classList.add("on");
  setTimeout(()=>{
    enter(d.to, d.spawn);
    fade.classList.remove("on");
  },280);
}
function renderLine(){spkEl.textContent=curName;txtEl.textContent=curLines[curIdx];}
function advance(){
  curIdx++;
  if(curIdx>=curLines.length){
    dialogOpen=false;dlgEl.classList.remove("show");hintEl.style.opacity="1";
  } else renderLine();
}

/* ---------- 移动与碰撞 ---------- */
function update(dt){
  if(dialogOpen)return;
  let dx=0,dy=0;
  if(keys["a"]||keys["arrowleft"])dx--;
  if(keys["d"]||keys["arrowright"])dx++;
  if(keys["w"]||keys["arrowup"])dy--;
  if(keys["s"]||keys["arrowdown"])dy++;
  if(stick.active&&(stick.x||stick.y)){dx+=stick.x;dy+=stick.y;}
  if(dx||dy){
    const l=Math.hypot(dx,dy);dx/=l;dy/=l;
    if(Math.abs(dx)>Math.abs(dy))player.dir=dx>0?"right":"left";
    else player.dir=dy>0?"down":"up";
    const sp=player.speed*dt;
    moveAxis(dx*sp,0);moveAxis(0,dy*sp);
    player.step+=dt*9;
  } else player.step=0;
}
function moveAxis(mx,my){
  const nx=player.x+mx,ny=player.y+my,hw=player.w/2,hh=player.h/2;
  const c1=Math.floor((nx-hw)/TILE),c2=Math.floor((nx+hw-.01)/TILE);
  const r1=Math.floor((ny-hh)/TILE),r2=Math.floor((ny+hh-.01)/TILE);
  for(let r=r1;r<=r2;r++)for(let c=c1;c<=c2;c++)if(solid(S,c,r))return;
  player.x=nx;player.y=ny;
}

/* ---------- 绘制 ---------- */
function drawSky(t){
  const g=ctx.createLinearGradient(0,0,0,170);
  g.addColorStop(0,"#070b16");g.addColorStop(.55,"#0d1526");g.addColorStop(1,"#16203a");
  ctx.fillStyle=g;ctx.fillRect(0,0,cv.width,170);
  ctx.save();ctx.globalAlpha=.16;
  const mg=ctx.createLinearGradient(0,40,cv.width,120);
  mg.addColorStop(0,"rgba(90,120,190,0)");mg.addColorStop(.5,"rgba(140,170,230,1)");
  mg.addColorStop(1,"rgba(90,120,190,0)");
  ctx.fillStyle=mg;ctx.beginPath();
  ctx.ellipse(cv.width/2,78,cv.width*.62,26,-.06,0,6.283);ctx.fill();ctx.restore();
  for(const s of stars){
    const tw=.55+.45*Math.sin(t*s.sp+s.ph);
    ctx.globalAlpha=tw;
    ctx.fillStyle=s.hue>.9?"#ffd9a0":(s.hue>.78?"#a8c8ff":"#ffffff");
    ctx.fillRect(Math.round(s.x),Math.round(s.y),s.r,s.r);
    if(s.r===2){
      ctx.globalAlpha=tw*.35;
      ctx.fillRect(Math.round(s.x)-1,Math.round(s.y),4,1);
      ctx.fillRect(Math.round(s.x),Math.round(s.y)-1,1,4);
    }
  }
  ctx.globalAlpha=1;
}
function drawFloor(){
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const t=S.map[r][c],x=c*TILE,y=r*TILE;
    if(t==="#"){
      ctx.fillStyle="#10141e";ctx.fillRect(x,y,TILE,TILE);
      ctx.fillStyle="#1a2030";ctx.fillRect(x+2,y+2,TILE-4,TILE-4);
    } else if(t==="R"){
      ctx.fillStyle="#0a1020";ctx.fillRect(x,y,TILE,TILE);
      ctx.fillStyle="#4a5670";ctx.fillRect(x+14,y+6,4,22);
      ctx.fillStyle="#5d6b88";ctx.fillRect(x+13,y+4,6,3);
      ctx.fillStyle="#3a4458";ctx.fillRect(x,y+16,TILE,3);
    } else if(t==="O"){
      ctx.fillStyle="rgba(8,12,22,.15)";ctx.fillRect(x,y,TILE,TILE);
    } else {
      const alt=(c+r)%2===0;
      ctx.fillStyle=alt?"#2a3040":"#262c3a";ctx.fillRect(x,y,TILE,TILE);
      ctx.fillStyle="rgba(255,255,255,.03)";ctx.fillRect(x,y,TILE,1);ctx.fillRect(x,y,1,TILE);
    }
  }
}
function drawProps(t){
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const ty=S.map[r][c],x=c*TILE,y=r*TILE;
    if(ty==="T"){
      if(scene.startsWith("lab")||scene==="lib"){
        ctx.fillStyle="#3d2f20";ctx.fillRect(x+1,y+6,TILE-2,TILE-10);
        ctx.fillStyle="#8a6a3e";ctx.fillRect(x+1,y+2,TILE-2,8);
        ctx.fillStyle="#a8824c";ctx.fillRect(x+1,y+2,TILE-2,3);
        ctx.fillStyle="#9fd6c8";ctx.fillRect(x+7,y-4,6,8);
        ctx.fillStyle="#c9e8de";ctx.fillRect(x+8,y-3,2,4);
        ctx.fillStyle="#d8b06a";ctx.fillRect(x+19,y-3,5,7);
      } else if(scene==="yard"){
        ctx.fillStyle="#2a2014";ctx.fillRect(x+14,y+18,4,12);
        ctx.fillStyle="#1e3a2a";ctx.beginPath();ctx.arc(x+16,y+14,11,0,6.283);ctx.fill();
        ctx.fillStyle="#274a34";ctx.beginPath();ctx.arc(x+13,y+11,7,0,6.283);ctx.fill();
      } else {
        ctx.fillStyle="#2c3444";ctx.fillRect(x+8,y+16,16,14);
        ctx.fillStyle="#3a4458";ctx.fillRect(x+10,y+18,12,10);
        ctx.save();ctx.translate(x+16,y+16);ctx.rotate(-.62);
        ctx.fillStyle="#4a5670";ctx.fillRect(-5,-26,10,30);
        ctx.fillStyle="#5d6b88";ctx.fillRect(-5,-26,10,4);
        ctx.fillStyle="#8fa8c8";ctx.fillRect(-4,-27,8,2);ctx.restore();
        ctx.strokeStyle="#6a7a96";ctx.lineWidth=1;
        ctx.beginPath();ctx.arc(x+16,y+22,6,0,6.283);ctx.stroke();
      }
    } else if(ty==="L"){
      ctx.fillStyle="#3a3020";ctx.fillRect(x+2,y+10,TILE-4,TILE-14);
      ctx.fillStyle="#5a4a2e";ctx.fillRect(x+2,y+8,TILE-4,5);
      ctx.fillStyle="#c8c0a8";ctx.fillRect(x+6,y+4,TILE-12,10);
      ctx.fillStyle="#3a3020";ctx.fillRect(x+10,y+7,1,1);ctx.fillRect(x+15,y+6,1,1);
      ctx.fillRect(x+19,y+9,1,1);
    } else if(ty==="B"){
      ctx.fillStyle="#3a2e1e";ctx.fillRect(x+2,y+12,TILE-4,10);
      ctx.fillStyle="#54432a";ctx.fillRect(x+2,y+10,TILE-4,5);
      ctx.fillStyle="#2a2014";ctx.fillRect(x+4,y+22,3,8);ctx.fillRect(x+TILE-7,y+22,3,8);
    } else if(ty==="W"){
      if(scene.startsWith("lab")||scene==="lib"){
        ctx.fillStyle="#8fa8bd";ctx.fillRect(x+3,y+3,TILE-6,TILE-6);
        ctx.fillStyle="#b9cde0";ctx.fillRect(x+5,y+5,TILE-10,10);
        ctx.fillStyle="#5d6f80";ctx.fillRect(x+TILE/2-1,y+3,2,TILE-6);
        ctx.fillRect(x+3,y+TILE/2-1,TILE-6,2);
      } else {
        ctx.fillStyle="#0d1526";ctx.fillRect(x+3,y+3,TILE-6,TILE-6);
        ctx.fillStyle="#2a3a56";ctx.fillRect(x+3,y+3,TILE-6,2);
        ctx.fillStyle="#6a7a96";ctx.fillRect(x+TILE/2-1,y+3,2,TILE-6);
      }
    } else if(ty==="S"){
      ctx.fillStyle="#3a2a18";ctx.fillRect(x+1,y,TILE-2,TILE);
      const cols=["#8a3a2a","#3a5a7a","#7a6a2a","#4a6a3a","#6a3a6a"];
      for(let i=0;i<5;i++){
        ctx.fillStyle=cols[(i+c)%cols.length];
        ctx.fillRect(x+4+i*5,y+5,4,10);ctx.fillRect(x+4+i*5,y+19,4,9);
      }
    } else if(ty==="C"){
      ctx.fillStyle="#4a3a24";ctx.fillRect(x+6,y+8,TILE-12,TILE-12);
      ctx.fillStyle="#5d4a2e";ctx.fillRect(x+6,y+8,TILE-12,5);
      ctx.fillStyle="#3a2c1a";ctx.fillRect(x+7,y+TILE-6,3,5);ctx.fillRect(x+TILE-10,y+TILE-6,3,5);
    } else if(ty==="P"){
      ctx.fillStyle="#7a4a2a";ctx.fillRect(x+10,y+18,12,10);
      ctx.fillStyle="#3f7a3a";ctx.fillRect(x+8,y+8,16,12);
      ctx.fillStyle="#4f9448";ctx.fillRect(x+11,y+5,10,8);
    } else if(ty==="D"){
      ctx.fillStyle="#2a2014";ctx.fillRect(x,y+2,3,TILE-2);
    }
  }
  // 门
  for(const d of S.doors){
    const x=d.c*TILE,y=d.r*TILE,w=d.w*TILE,h=d.h*TILE;
    if(scene==="yard"||scene==="lib"||scene.startsWith("lab")){
      // 门框（深色）+ 门板（木色）+ 把手，横竖门统一画法
      ctx.fillStyle="#2a2014";ctx.fillRect(x,y,w,h);
      ctx.fillStyle="#5a4228";ctx.fillRect(x+2,y+2,w-4,h-4);
      ctx.fillStyle="#c8a860";
      if(d.h>d.w)ctx.fillRect(x+w-8,y+h/2-2,3,4);   // 竖门把手靠右
      else ctx.fillRect(x+w-9,y+h/2-2,4,3);          // 横门把手靠右
      ctx.fillStyle="#8fa4c4";ctx.font="10px sans-serif";
      if(d.h>d.w){  // 竖门：标签画在门右侧
        ctx.textAlign="left";ctx.fillText(d.label,x+w+6,y+h/2+4);
      } else {
        const ly=(d.r<=1)?y+h+12:y-6;  // 贴上边界的门，标签画在门下方
        ctx.textAlign="center";ctx.fillText(d.label,x+w/2,ly);
      }
      ctx.textAlign="left";
    } else {
      ctx.fillStyle="#0a0e16";ctx.fillRect(x,y,w,h);
      ctx.fillStyle="#2a3a56";ctx.fillRect(x,y,w,2);
    }
  }
  if(scene==="obs"){
    ctx.fillStyle="#4a5670";ctx.fillRect(TILE,3*TILE+2,(COLS-2)*TILE,4);
    ctx.fillStyle="#5d6b88";ctx.fillRect(TILE,3*TILE+2,(COLS-2)*TILE,1);
  }
}
function drawCat(x,y,t){
  const bob=Math.sin(t*9)*1.2,px=Math.round(x),py=Math.round(y+bob);
  ctx.fillStyle="rgba(0,0,0,.35)";ctx.beginPath();
  ctx.ellipse(px,py+8,11,4,0,0,6.283);ctx.fill();
  ctx.strokeStyle="#f2f0ea";ctx.lineWidth=3;ctx.beginPath();
  const tw=Math.sin(t*4)*4;
  ctx.moveTo(px-8,py+2);ctx.quadraticCurveTo(px-16,py-4+tw,px-12,py-10+tw);ctx.stroke();
  ctx.fillStyle="#f7f5ef";ctx.fillRect(px-8,py-4,16,12);
  ctx.fillStyle="#fbfaf5";ctx.fillRect(px-7,py-13,14,11);
  ctx.beginPath();ctx.moveTo(px-7,py-13);ctx.lineTo(px-5,py-19);ctx.lineTo(px-1,py-13);ctx.fill();
  ctx.beginPath();ctx.moveTo(px+7,py-13);ctx.lineTo(px+5,py-19);ctx.lineTo(px+1,py-13);ctx.fill();
  ctx.fillStyle="#e8b9b0";ctx.fillRect(px-5,py-16,2,2);ctx.fillRect(px+3,py-16,2,2);
  ctx.fillStyle="#5ad6a8";ctx.fillRect(px-5,py-10,2,3);ctx.fillRect(px+3,py-10,2,3);
  ctx.fillStyle="#e8a0a0";ctx.fillRect(px-1,py-6,2,2);
}
function drawNPC(n,t){
  const px=Math.round(n.x*TILE),py=Math.round(n.y*TILE);
  const bob=Math.sin(t*2+(n.id==="herman"?0:1.7))*1.0,y=py+bob;
  ctx.fillStyle="rgba(0,0,0,.35)";ctx.beginPath();
  ctx.ellipse(px,py+14,12,4,0,0,6.283);ctx.fill();
  ctx.fillStyle="#1e2430";ctx.fillRect(px-6,y+4,5,10);ctx.fillRect(px+1,y+4,5,10);
  ctx.fillStyle=n.color;ctx.fillRect(px-8,y-10,16,16);
  ctx.fillStyle="#dfe4ec";ctx.fillRect(px-2,y-10,4,12);
  ctx.fillStyle="#4a8a5a";ctx.fillRect(px-1,y-7,2,2);
  ctx.fillStyle="#e8c9a8";ctx.fillRect(px-6,y-22,12,12);
  if(n.id==="alva"){
    // 长发：头顶 + 两侧垂到肩下的发丝
    ctx.fillStyle=n.hair;
    ctx.fillRect(px-7,y-25,14,6);
    ctx.fillRect(px-8,y-22,3,14);
    ctx.fillRect(px+5,y-22,3,14);
    ctx.fillRect(px-8,y-9,3,4);ctx.fillRect(px+5,y-9,3,4);
    // 马尾：从画面右侧（他的左肩）扎起，垂到肩前
    ctx.fillStyle="#b8b2a4";
    ctx.fillRect(px+7,y-21,2,2);                 // 发绳
    ctx.beginPath();
    ctx.moveTo(px+8,y-20);
    ctx.quadraticCurveTo(px+13,y-14,px+11,y-6);
    ctx.quadraticCurveTo(px+10,y-2,px+8,y-3);
    ctx.quadraticCurveTo(px+9,y-11,px+6,y-18);
    ctx.closePath();ctx.fill();
    ctx.fillStyle="#d6d1c4";ctx.fillRect(px+9,y-14,1,7);  // 高光
  } else {
    ctx.fillStyle=n.hair;ctx.fillRect(px-6,y-24,12,5);
    ctx.fillRect(px-7,y-22,2,6);ctx.fillRect(px+5,y-22,2,6);
  }
  if(n.id==="alva"){
    ctx.fillStyle="#3f7fd4";ctx.fillRect(px-4,y-17,2,2);ctx.fillRect(px+2,y-17,2,2);
    ctx.fillStyle="#a8d0ff";ctx.fillRect(px-4,y-17,1,1);ctx.fillRect(px+2,y-17,1,1);
    ctx.strokeStyle="#c9c4b8";ctx.lineWidth=1;
    ctx.strokeRect(px-5.5,y-18.5,4,4);ctx.strokeRect(px+1.5,y-18.5,4,4);
    ctx.beginPath();ctx.moveTo(px-1.5,y-16.5);ctx.lineTo(px+1.5,y-16.5);ctx.stroke();
  } else {
    ctx.fillStyle="#2a2018";ctx.fillRect(px-4,y-17,2,2);ctx.fillRect(px+2,y-17,2,2);
  }
}
function drawVignette(){
  const g=ctx.createRadialGradient(cv.width/2,cv.height*.45,cv.height*.28,
    cv.width/2,cv.height*.45,cv.height*.95);
  g.addColorStop(0,"rgba(0,0,0,0)");g.addColorStop(1,"rgba(2,4,10,.62)");
  ctx.fillStyle=g;ctx.fillRect(0,0,cv.width,cv.height);
}

/* ---------- 主循环 ---------- */
let last=performance.now();
function loop(now){
  const dt=Math.min((now-last)/1000,.05);last=now;const t=now/1000;
  update(dt);
  ctx.clearRect(0,0,cv.width,cv.height);
  drawSky(t);drawFloor();drawProps(t);
  const ents=[{y:player.y,draw:()=>drawCat(player.x,player.y,t)},
    ...S.npcs.map(n=>({y:n.y*TILE,draw:()=>drawNPC(n,t)}))].sort((a,b)=>a.y-b.y);
  ents.forEach(e=>e.draw());
  drawVignette();
  if(!dialogOpen){
    let shown=false;
    for(const d of S.doors){
      const cx=(d.c+d.w/2)*TILE,cy=(d.r+d.h/2)*TILE;
      if(Math.hypot(cx-player.x,cy-player.y)<46){
        ctx.fillStyle="rgba(238,242,248,.94)";ctx.fillRect(cx-30,cy-46,60,16);
        ctx.fillStyle="#2c3f5e";ctx.font="10px sans-serif";ctx.textAlign="center";
        ctx.fillText(isTouch?"进门":"E 进门",cx,cy-34);ctx.textAlign="left";shown=true;break;
      }
    }
    if(!shown)for(const n of S.npcs){
      if(Math.hypot(n.x*TILE-player.x,n.y*TILE-player.y)<62){
        ctx.fillStyle="rgba(238,242,248,.94)";ctx.fillRect(n.x*TILE-28,n.y*TILE-40,56,16);
        ctx.fillStyle="#2c3f5e";ctx.font="10px sans-serif";ctx.textAlign="center";
        ctx.fillText(isTouch?"说话":"E 说话",n.x*TILE,n.y*TILE-28);ctx.textAlign="left";break;
      }
    }
  }
  requestAnimationFrame(loop);
}
enter("yard");
requestAnimationFrame(loop);
</script>
